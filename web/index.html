<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movimentações internas</title>
  <link rel="stylesheet" href="assets/app.css">
  <script>
    // aplica o tema salvo antes de desenhar a página (evita piscar)
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="pagina">
    <header class="topo">
      <div>
        <p class="sobre">Relatório gerencial</p>
        <h1>Movimentações internas</h1>
        <p class="periodo" id="periodo">&nbsp;</p>
      </div>
      <button class="icone" id="tema" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </header>

    <section class="filtros" aria-label="Filtros">
      <label class="campo"><span>Mês</span><select id="f-mes"></select></label>
      <label class="campo"><span>Ano</span><select id="f-ano"></select></label>
      <label class="campo" id="campo-loja" hidden><span>Loja</span><select id="f-loja"><option value="">Todas</option></select></label>
      <label class="campo"><span>Setor</span><select id="f-setor"><option value="">Todos</option></select></label>
      <label class="campo"><span>Motivo</span><select id="f-motivo"><option value="">Todos</option></select></label>
      <label class="campo"><span>Depósito</span><select id="f-deposito"><option value="">Todos</option></select></label>
      <button class="botao" id="atualizar" type="button" title="Buscar de novo no banco">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        Atualizar
      </button>
    </section>

    <div id="avisos"></div>

    <!-- tabelas setor × depósito: a principal e uma por quadro de config/regras.json (montadas pelo app.js) -->
    <div id="quadros"></div>

    <section class="cartao">
      <div class="cartao-topo">
        <div>
          <h2>Relação de movimentações</h2>
          <p class="ajuda" id="mov-resumo">&nbsp;</p>
        </div>
        <div class="acoes">
          <input class="busca" id="mov-busca" type="search" placeholder="Nº, produto ou motivo" aria-label="Buscar movimentação">
          <select id="mov-ordem" aria-label="Ordenar">
            <option value="mov">Nº (mais recente)</option>
            <option value="valor">Maior valor</option>
            <option value="data">Data</option>
          </select>
          <button class="botao fantasma" type="button" data-csv="itens" title="Baixar CSV com os produtos">CSV</button>
        </div>
      </div>
      <div class="rolagem alta">
        <table class="relacao" id="t-relacao">
          <thead><tr>
            <th>Nº</th>
            <th>Depósito</th>
            <th>Motivo</th>
            <th>Setor</th>
            <th class="num">Valor de custo</th>
            <th class="num">Total</th>
          </tr></thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
    </section>

    <footer class="rodape">Saídas de estoque (motivos de saída), sem movimentações canceladas. Valor = quantidade × preço de custo do item. Depósito = grupo do produto.</footer>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
